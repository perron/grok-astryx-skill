[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-astryx-skill"
version = "0.1.0"
description = "Unofficial Grok Bot skill and tiny helper for building UI with Meta's Astryx CLI and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "skills", "astryx", "grok", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/grok-astryx-skill"
Repository = "https://github.com/perron/grok-astryx-skill"
Issues = "https://github.com/perron/grok-astryx-skill/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grok-astryx-skill = "grok_astryx_skill.cli:main"

[tool.setuptools.packages.find]
include = ["grok_astryx_skill*"]

[tool.setuptools.package-data]
grok_astryx_skill = ["data/grok-astryx/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
